<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Seating Plan | Nelusha & Ashan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <p class="chapter">16 January 2027</p>

    <h2 class="welcome-heading">Welcome to the story of</h2>

    <h1 class="couple-names">Nelusha & Ashan</h1>

    <div class="divider"></div>

    <h3 class="title">Wedding Seating Plan</h3>

    <p class="subtitle">
      Enter your first name, last name, or full name to find your table.
    </p>

    <div class="search-wrapper">
      <input
        type="text"
        id="searchName"
        placeholder="Search your name here..."
        onkeydown="if(event.key==='Enter') findGuest()"
      >
    </div>

    <button onclick="findGuest()">
      Find My Table
    </button>

    <div id="result"></div>

  </div>

  <script src="script.js"></script>

</body>
